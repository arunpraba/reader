<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
    />
    <title>Margin</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #eeece6;
        color: #234b40;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
    </style>
    <script>
      // Navigate inside the Capacitor WebView (allowNavigation includes this host).
      // Avoid server.url — on Android it often fails with the system error page.
      // Local Next via adb reverse (localhost is a secure context — needed for Edge TTS).
      // Production: "https://arunpraba.github.io/reader/"
      var REMOTE = "http://localhost:3001/";
      window.location.replace(REMOTE);
      setTimeout(function () {
        if (location.href.indexOf("localhost") === -1 && location.href.indexOf("arunpraba.github.io") === -1) {
          location.replace("error.html");
        }
      }, 4000);
    </script>
  </head>
  <body>
    <main>
      <p>Opening Margin…</p>
    </main>
  </body>
</html>
